name: wo_tracker
description: Work order tracker for electrical distribution work orders.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Database on the device that syncs with Supabase (works fully offline).
  powersync: ^2.4.0
  supabase_flutter: ^2.18.2
  # Report PDF, preview, print and page images.
  pdf: ^3.13.1
  printing: ^5.15.1
  # Taking or choosing photos for steps.
  image_picker: ^1.1.2
  # Reading a meter's barcode with the phone camera.
  mobile_scanner: ^6.0.0
  # Saving and sharing files.
  file_selector: ^1.0.3
  open_filex: ^4.5.0
  share_plus: ^13.3.1
  # Local backup: the data folder written to (and read back from) one .zip file.
  archive: ^4.5.2
  path_provider: ^2.1.5
  # Lets the app tell path_provider which folder to use, so start-up does not fail when the
  # Windows profile folder cannot be created.
  path_provider_platform_interface: ^2.1.2
  path_provider_windows: ^2.3.0
  shared_preferences: ^2.5.3
  shared_preferences_platform_interface: ^2.4.0
  shared_preferences_windows: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/rules/rules.json
    - assets/i18n/en.json
    - assets/i18n/ar.json
    - assets/calendar/umalqura.json
    - assets/demo/demo_orders.json
    - assets/fonts/
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
